// Android target of the shared module. Groovy, and only applied when an Android SDK is
// present, so the rest builds without the Android Gradle plugin. The core's .so comes from
// the app (androidApp builds core/jni with the NDK).
apply plugin: 'com.android.kotlin.multiplatform.library'

kotlin {
  androidLibrary {
    namespace = 'nl.eschouten.scraper.shared'
    compileSdk { version = release(rootProject.ext.androidCompileSdk) { minorApiLevel = 0 } }
    minSdk = rootProject.ext.androidMinSdk
  }
  sourceSets {
    androidMain {
      kotlin.srcDir('src/jniMain/kotlin')   // the Bluetooth permissions: androidApp's manifest
    }
  }
}
