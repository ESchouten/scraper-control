# The iOS app (SwiftUI) on top of the shared Kotlin module. Generate the Xcode project with
#   brew install xcodegen && cd native/iosApp && xcodegen
# then open ScraperControl.xcodeproj. The build runs Gradle for the Shared framework.
# UI tests (the shared scenarios, demo robot):
#   xcodebuild test -project ScraperControl.xcodeproj -scheme ScraperControl \
#     -destination 'platform=iOS Simulator,name=iPhone 15 Pro' TEST_RUNNER_SCREENSHOT_DIR=/tmp/shots
name: ScraperControl
options:
  bundleIdPrefix: nl.eschouten
  deploymentTarget:
    iOS: "16.0"
targets:
  ScraperControl:
    type: application
    platform: iOS
    sources: [ScraperControl, Intents]
    dependencies:
      - target: ScraperWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.eschouten.scraper
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scraper Control
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Om de robot te bedienen via Bluetooth.
        CODE_SIGN_ENTITLEMENTS: ScraperControl/App.entitlements
        MARKETING_VERSION: 0.6.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, Shared, -lc++]
        # the Shared framework is built for Apple Silicon simulators only (iosSimulatorArm64)
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    preBuildScripts:
      - name: Shared Kotlin module
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.." && ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  ScraperWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Widgets, Intents]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Scraper Control
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.eschouten.scraper.widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        MARKETING_VERSION: 0.6.0
        CURRENT_PROJECT_VERSION: 1
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, Shared, -lc++]
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Om de robot te bedienen via Bluetooth.
    preBuildScripts:
      - name: Shared Kotlin module
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.." && ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  ScraperControlUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ScraperControl
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: nl.eschouten.scraper.uitests
        TEST_TARGET_NAME: ScraperControl
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, Shared, -lc++]
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
schemes:
  ScraperControl:
    build:
      targets:
        ScraperControl: all
        ScraperControlUITests: [test]
    test:
      targets: [ScraperControlUITests]
      gatherCoverageData: false
