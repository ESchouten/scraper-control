org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
android.useAndroidX=true
kotlin.mpp.enableCInteropCommonization=true
# The version, for every app and the M5: MAJOR.MINOR here (raise it by hand for a big change),
# the third number is the build number, automatically: 1.6 + build 120 = 1.6.120. The build
# number is the commit count (+ buildBase below); devices compare it to find an update.
# (iOS: set-version.sh, the M5: firmware/version.py read the same.)
scraper.version=1.6
# The robot driver the apps are built with: a folder in ../drivers/.
scraper.driver=lely
# Build number = this + the commit count. The repository's history starts later than the
# first builds, so the count starts here: builds keep rising and devices take the update.
scraper.buildBase=91
