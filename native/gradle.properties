org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
android.useAndroidX=true
kotlin.mpp.enableCInteropCommonization=true
# The app's version, for every app (Android versionName, the About row; iOS: project.yml,
# checked by scenarios/check.py). The build number is the number of commits.
scraper.version=1.6.0
# The robot driver the apps are built with: a folder in ../drivers/.
scraper.driver=lely
# Build number = this + the commit count. The public repository starts with a fresh history,
# so it starts here where the old one stopped (tools/publish_public.sh): builds keep rising
# and devices still take the update.
scraper.buildBase=91
