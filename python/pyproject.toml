[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scraper-control"
version = "1.6"
description = "Control a manure scraper robot over Bluetooth LE"
requires-python = ">=3.9"
dependencies = ["bleak>=0.22"]

[tool.setuptools]
packages = ["scraper_control"]
