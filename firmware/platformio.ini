; Scraper Control buttons: M5Stack Basic (ESP32) with 3 buttons = route A / B / C.
; Build and flash over USB:  pio run -t upload   (after that it updates itself from the releases)
[env:m5stack-core]
platform = espressif32
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
; 16 MB flash (Basic v2.7): two 6 MB app slots, so updates can come over wifi.
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 6291456
; FW_VERSION / FW_BUILD for main.cpp: the apps' version and the commit count (version.py)
extra_scripts = pre:version.py
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=0
  ; WiFi.h includes Network.h, but the library finder does not give WiFi that include path
  -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
  ; the same for Preferences, which the framework's BLE library includes
  -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Preferences/src
  ; the screens are drawn with LVGL; its settings are include/lv_conf.h
  -DLV_CONF_INCLUDE_SIMPLE -DLV_LVGL_H_INCLUDE_SIMPLE -I${PROJECT_DIR}/include
  -DLV_CONF_KCONFIG_EXTERNAL_INCLUDE=\"lv_no_kconfig.h\"
lib_deps =
  m5stack/M5Unified@^0.2.2
  lvgl/lvgl@9.2.2                        ; the screens (pinned: test_host builds the same version)
  symlink://../drivers/lely              ; the robot driver (the same code as in the apps)
lib_ldf_mode = deep+

