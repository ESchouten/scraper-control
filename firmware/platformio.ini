; Scraper Control buttons: M5Stack Basic (ESP32) with 3 buttons = route A / B / C.
; Build and flash over USB:  pio run -e m5stack-core -t upload
; Over wifi: on the M5 hold right 1.5 s > Update, then  SCRAPER_OTA_PASS=... pio run -e m5stack-core-ota -t upload
[env:m5stack-core]
platform = espressif32
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
; 16 MB flash (Basic v2.7): two 6 MB app slots, so updates can come over wifi (OTA).
; The first time after this change: flash once over USB.
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 6291456
; FW_VERSION / FW_BUILD: the apps' version and the commit count (version.py)
extra_scripts = pre:version.py
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=0
  ; WiFi.h includes Network.h, but the library finder does not give WiFi that include path
  -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
  ; the screens are drawn with LVGL; its settings are include/lv_conf.h
  -DLV_CONF_INCLUDE_SIMPLE -DLV_LVGL_H_INCLUDE_SIMPLE -I${PROJECT_DIR}/include
  -DLV_CONF_KCONFIG_EXTERNAL_INCLUDE=\"lv_no_kconfig.h\"
lib_deps =
  m5stack/M5Unified@^0.2.2
  h2zero/NimBLE-Arduino@^2.1.0
  lvgl/lvgl@9.2.2                        ; the screens (pinned: test_host builds the same version)
  symlink://../drivers/lely              ; the robot driver (the same code as in the apps)
lib_ldf_mode = deep+

; Update over wifi: the M5 must show "Ready for an update" (settings > Update).
[env:m5stack-core-ota]
extends = env:m5stack-core
upload_protocol = espota
upload_port = scraper-knop.local
upload_flags = --auth=${sysenv.SCRAPER_OTA_PASS}
