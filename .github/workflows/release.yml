name: release
# One release per version, with everything in it:
#   update.ini                    the devices' update manifest: one signed block per board, naming
#                                 that board's file. The only fixed name: devices look for it in
#                                 releases/latest (settings > Wifi > Update, or automatically)
#   scraper-control-<board>-<v>.bin  the firmware per board (now: m5stack-core = the M5 buttons)
#   scraper-control-<v>.apk       Android app (install by hand, or keep it updated with Obtainium)
#   Scraper Control desktop       macOS .dmg, Linux .deb, Windows .exe (installers, not signed)
# Run it by hand (Actions > release > Run workflow) when a version should go out.
# The M5s download from github.com/<FW_REPO>/releases/latest, so every release must carry the
# firmware: that is why the apps are not released separately.
#
# Secrets:
#   BUILD_SECRETS                the secrets built into the apps and firmware: NAME=value lines,
#                                the same as ~/.scraper-control/secrets (tools/secrets.py)
#   FIRMWARE_SIGNING_KEY         ECDSA P-256 PEM; public half in firmware/src/ReleaseKey.h
#   ANDROID_KEYSTORE             the app's signing keystore, base64 (same key for every version,
#                                or Android refuses to install an update over the old app)
#   ANDROID_KEYSTORE_PASSWORD    its password (alias "scraper-control")
#   APT_SIGNING_KEY              OpenPGP private key (armored, no passphrase) that signs the apt
#                                repository on GitHub Pages; its public half is published there
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read # the ci run of this commit

jobs:
  version: # 1.6.120: scraper.version + the build number (commit count + scraper.buildBase)
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.v.outputs.build }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        run: |
          BUILD=$(( $(git rev-list --count HEAD) + $(sed -n 's/^scraper.buildBase=//p' native/gradle.properties) ))
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^scraper.version=//p' native/gradle.properties).$BUILD" >> "$GITHUB_OUTPUT"
      - name: Tested? (a release only builds; workflow ci has tested this commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" -q .total_count)
          test "$n" -gt 0 || { echo "ci has not passed for $GITHUB_SHA (yet)"; exit 1; }

  firmware:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the build number is the commit count
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # What ci compiled (read only: a release build carries the secrets, ci's must not)
      - uses: actions/cache/restore@v6
        with:
          # sdkconfig.defaults: by its first line the platform knows its libraries are built
          path: |
            ~/.platformio
            firmware/sdkconfig.defaults
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - uses: actions/cache/restore@v6
        with:
          path: firmware/.pio/build
          key: pio-build-${{ hashFiles('firmware/platformio.ini') }}-${{ github.sha }}
          restore-keys: pio-build-${{ hashFiles('firmware/platformio.ini') }}-
      - run: pip install platformio
      - name: Build secrets
        env:
          BUILD_SECRETS: ${{ secrets.BUILD_SECRETS }}
        run: python3 tools/secrets.py --release
      - name: Build
        working-directory: firmware
        run: pio run
      - name: Sign
        env:
          FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          test -n "$FIRMWARE_SIGNING_KEY" || { echo "secret FIRMWARE_SIGNING_KEY is missing"; exit 1; }
          mkdir out
          BIN="out/scraper-control-m5stack-core-$VERSION.bin"
          grep -q "$VERSION" firmware/.pio/build/m5stack-core/firmware.bin || { echo "the firmware does not carry version $VERSION"; exit 1; }
          cp firmware/.pio/build/m5stack-core/firmware.bin "$BIN"
          echo "# Scraper Control $VERSION: one block per board" > out/update.ini
          python3 firmware/sign_release.py "$BIN" --board m5stack-core --key "$FIRMWARE_SIGNING_KEY" --version "$VERSION" --build "$BUILD" >> out/update.ini
          cat out/update.ini
      - name: First-install image (bootloader, partitions and app in one file, from address 0)
        run: |
          pip install "esptool>=5"
          B=firmware/.pio/build/m5stack-core
          esptool --chip esp32 merge-bin -o "out/scraper-control-m5stack-core-$VERSION-full.bin" \
            --flash-mode dio --flash-freq 80m --flash-size 16MB \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: out/

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true # ci's caches; a release adds nothing to them
      - name: Build secrets
        env:
          BUILD_SECRETS: ${{ secrets.BUILD_SECRETS }}
        run: python3 tools/secrets.py --release
      - name: Signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          test -n "$ANDROID_KEYSTORE" || { echo "secret ANDROID_KEYSTORE is missing"; exit 1; }
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SCRAPER_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build the APK
        working-directory: native
        env:
          SCRAPER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease --console=plain
          mkdir ../out
          cp androidApp/build/outputs/apk/release/*.apk "../out/scraper-control-$VERSION.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/

  desktop:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true # ci's caches; a release adds nothing to them
      - name: Build secrets
        shell: bash
        env:
          BUILD_SECRETS: ${{ secrets.BUILD_SECRETS }}
        run: python tools/secrets.py --release
      - name: Build the installer (.dmg / .deb / .exe, with its own Java)
        working-directory: native
        shell: bash
        run: |
          ./gradlew :composeApp:packageDistributionForCurrentOS --console=plain
          mkdir -p ../out
          cp composeApp/build/compose/binaries/main/*/*.{dmg,deb,exe} ../out/ 2>/dev/null || true
          ls ../out/*
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: out/
          if-no-files-found: error

  # GitHub Pages (set to "GitHub Actions" once, Settings > Pages): the browser installer for the
  # buttons (docs/install) with this release's first-install image, and an apt repository with
  # this release's .deb (apt/, flat, signed), so `apt upgrade` brings new versions.
  installer:
    needs: [version, firmware, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: fw
      - uses: actions/download-artifact@v8
        with:
          name: desktop-ubuntu-latest
          path: deb
      - name: Page, manifest and image
        run: |
          mkdir site
          cp docs/install/index.html site/
          cp "fw/scraper-control-m5stack-core-$VERSION-full.bin" site/scraper-control-m5stack-core-full.bin
          cat > site/manifest.json <<JSON
          {"name": "Scraper Control buttons", "version": "$VERSION", "new_install_prompt_erase": true,
           "builds": [{"chipFamily": "ESP32", "parts": [{"path": "scraper-control-m5stack-core-full.bin", "offset": 0}]}]}
          JSON
      - name: Apt repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          test -n "$APT_SIGNING_KEY" || { echo "secret APT_SIGNING_KEY is missing"; exit 1; }
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          mkdir site/apt
          cp deb/*.deb site/apt/
          cd site/apt
          apt-ftparchive packages . > Packages
          gzip -k9 Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin="Scraper Control" \
            -o APT::FTPArchive::Release::Suite=stable release . > ../Release   # not listing itself
          mv ../Release .
          gpg --batch --yes --clearsign -o InRelease Release
          gpg --armor --export > scraper-control.asc
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5

  publish:
    needs: [version, firmware, android, desktop]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "{firmware,android,desktop-*}" # not the installer's github-pages
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -laR dist
          gh release create "v$VERSION" dist/* \
            --title "Scraper Control $VERSION" \
            --notes "Scraper Control $VERSION.

          - M5 buttons: they install this version themselves (settings, or automatically once a day / on a new wifi connection).
          - Android: install the .apk, or follow this repository with Obtainium for automatic updates.
          - Desktop: .dmg (macOS), .deb (Linux), .exe (Windows). Not signed: on a Mac, right-click > Open the first time; on Windows, More info > Run anyway."
