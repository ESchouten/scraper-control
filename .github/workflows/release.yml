name: release
# One release per version, with everything in it:
#   update.ini                    the devices' update manifest: one signed block per board, naming
#                                 that board's file. The only fixed name: devices look for it in
#                                 releases/latest (settings > Wifi > Update, or automatically)
#   scraper-control-<board>-<v>.bin  the firmware per board (now: m5stack-core = the M5 buttons)
#   firmware.bin + firmware.txt   TRANSITION ONLY: the same M5 build under the old names, for M5s on
#   + update.txt                  1.6.0 or older (firmware.txt) and build 113 (update.txt, the first
#                                 name of update.ini). Remove once those have updated.
#   scraper-control-<v>.apk       Android app (install by hand, or keep it updated with Obtainium)
#   Scraper Control desktop       macOS .dmg, Linux .deb (Windows: later, the core's CMake
#                                 build is not set up for MSVC yet)
# Run it by hand (Actions > release > Run workflow) when a version should go out.
# The M5s download from github.com/<FW_REPO>/releases/latest, so every release must carry the
# firmware: that is why the apps are not released separately.
#
# Secrets:
#   BUILD_SECRETS                the secrets built into the apps and firmware: NAME=value lines,
#                                the same as ~/.scraper-control/secrets (tools/secrets.py)
#   FIRMWARE_SIGNING_KEY         ECDSA P-256 PEM; public half in firmware/src/ReleaseKey.h
#   ANDROID_KEYSTORE             the app's signing keystore, base64 (same key for every version,
#                                or Android refuses to install an update over the old app)
#   ANDROID_KEYSTORE_PASSWORD    its password (alias "scraper-control")
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio cryptography
      - name: Build secrets
        env:
          BUILD_SECRETS: ${{ secrets.BUILD_SECRETS }}
        run: python3 tools/secrets.py --release
      - name: Build
        working-directory: firmware
        run: |
          cp include/config.example.h include/config.h
          pio run -e m5stack-core
      - name: Sign
        env:
          FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          test -n "$FIRMWARE_SIGNING_KEY" || { echo "secret FIRMWARE_SIGNING_KEY is missing"; exit 1; }
          BUILD=$(( $(git rev-list --count HEAD) + $(sed -n 's/^scraper.buildBase=//p' native/gradle.properties || echo 0) ))
          VERSION="$(sed -n 's/^scraper.version=//p' native/gradle.properties).$BUILD"   # 1.6.120
          mkdir out
          BIN="out/scraper-control-m5stack-core-$VERSION.bin"
          cp firmware/.pio/build/m5stack-core/firmware.bin "$BIN"
          echo "# Scraper Control $VERSION: one block per board" > out/update.ini
          python3 firmware/sign_release.py "$BIN" --board m5stack-core --key "$FIRMWARE_SIGNING_KEY" --version "$VERSION" --build "$BUILD" >> out/update.ini
          # TRANSITION ONLY (M5s on 1.6.0 or older look for firmware.txt, build 113 for update.txt); remove later
          cp out/update.ini out/update.txt
          cp "$BIN" out/firmware.bin
          python3 firmware/sign_release.py out/firmware.bin --legacy --key "$FIRMWARE_SIGNING_KEY" --version "$VERSION" --build "$BUILD" > out/firmware.txt
          cat out/update.ini out/firmware.txt
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build secrets
        env:
          BUILD_SECRETS: ${{ secrets.BUILD_SECRETS }}
        run: python3 tools/secrets.py --release
      - name: Signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          test -n "$ANDROID_KEYSTORE" || { echo "secret ANDROID_KEYSTORE is missing"; exit 1; }
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SCRAPER_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build the APK
        working-directory: native
        env:
          SCRAPER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease --console=plain
          VERSION="$(sed -n 's/^scraper.version=//p' gradle.properties).$(( $(git rev-list --count HEAD) + $(sed -n 's/^scraper.buildBase=//p' gradle.properties || echo 0) ))"
          mkdir ../out
          cp androidApp/build/outputs/apk/release/*.apk "../out/scraper-control-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/

  desktop:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build secrets
        shell: bash
        env:
          BUILD_SECRETS: ${{ secrets.BUILD_SECRETS }}
        run: python3 tools/secrets.py --release
      - name: Build the installer (.dmg / .deb, with its own Java)
        working-directory: native
        shell: bash
        run: |
          ./gradlew :composeApp:packageDistributionForCurrentOS --console=plain
          mkdir -p ../out
          cp composeApp/build/compose/binaries/main/*/*.{dmg,deb} ../out/ 2>/dev/null || true
          ls ../out/*
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: out/
          if-no-files-found: error

  publish:
    needs: [firmware, android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD=$(( $(git rev-list --count HEAD) + $(sed -n 's/^scraper.buildBase=//p' native/gradle.properties || echo 0) ))
          VERSION="$(sed -n 's/^scraper.version=//p' native/gradle.properties).$BUILD"   # 1.6.120
          ls -laR dist
          gh release create "v$VERSION" dist/* \
            --title "Scraper Control $VERSION" \
            --notes "Scraper Control $VERSION.

          - M5 buttons: they install this version themselves (settings, or automatically once a day / on a new wifi connection).
          - Android: install the .apk, or follow this repository with Obtainium for automatic updates.
          - Desktop: .dmg (macOS), .deb (Linux). Not signed by Apple: on a Mac, right-click > Open the first time."
