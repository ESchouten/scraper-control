name: ci
# Every check on a push, each part only when its files changed (a push of only docs runs
# nothing): the robot drivers' tests and the buttons' firmware (M5Stack), the apps (native/:
# shared Kotlin module with the robot driver, Compose for Android and desktop, SwiftUI for iOS).
# Run it by hand for everything, with the Windows scenario tests and iOS (macOS minutes count
# 10x; also once a day when something changed). Releases: workflow release, by hand.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # iOS once a day, only if native/, core/ or drivers/ changed

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.f.outputs.firmware }}
      apps: ${{ steps.f.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            firmware: [firmware/**, drivers/**, core/**, python/**, tests/**, native/gradle.properties, .github/workflows/ci.yml]
            apps: [native/**, core/**, drivers/**, .github/workflows/ci.yml]

  drivers:
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.firmware == 'true') }}
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Every robot driver's own tests (against its simulated robot), side by side
        run: ls drivers/*/tests/test_*.py | xargs -P 4 -n 1 python

  firmware:
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.firmware == 'true') }}
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - uses: actions/cache@v4 # what is compiled: only changed files compile again
        with:
          path: firmware/.pio/build
          key: pio-build-${{ hashFiles('firmware/platformio.ini') }}-${{ github.sha }}
          restore-keys: pio-build-${{ hashFiles('firmware/platformio.ini') }}-
      - run: pip install platformio cryptography
      - name: Firmware on a computer (editors, update manifest, syntax check)
        run: python tests/test_firmware.py
      - name: Build the M5Stack firmware
        working-directory: firmware
        run: pio run
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/.pio/build/m5stack-core/firmware.bin
            firmware/.pio/build/m5stack-core/bootloader.bin
            firmware/.pio/build/m5stack-core/partitions.bin

  apps-linux:
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.apps == 'true') }}
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared tests (core via JNI) against the simulated robot
        working-directory: native
        run: ./gradlew :shared:jvmTest --console=plain
      - name: Desktop app (Compose)
        working-directory: native
        run: ./gradlew :composeApp:packageUberJarForCurrentOS --console=plain
      - name: Scenario tests on the Compose app (desktop, demo robot) + screenshots
        working-directory: native
        run: ./gradlew :composeApp:jvmTest --console=plain
      - name: Android app (Compose, core via the NDK)
        working-directory: native
        run: ./gradlew :androidApp:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: scraper-control-native
          path: |
            native/androidApp/build/outputs/apk/debug/*.apk
            native/composeApp/build/compose/jars/*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-screenshots-and-reports
          path: |
            native/composeApp/build/screenshots/
            native/composeApp/build/reports/tests/
            native/shared/build/reports/tests/

  apps-windows:
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.apps == 'true') }}
    needs: changes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Scenario tests on Windows (the core built by the Windows compiler, demo robot); by hand, like iOS
        if: github.event_name == 'workflow_dispatch'
        working-directory: native
        shell: bash
        run: ./gradlew :composeApp:jvmTest --console=plain
      - name: Settings file on Windows (saving replaces the file there too)
        working-directory: native
        shell: bash
        run: ./gradlew :shared:jvmTest --tests "*FileStoreTest*" --console=plain
      - name: Windows installer (without build secrets, a release has them)
        working-directory: native
        shell: bash
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: scraper-control-windows
          path: native/composeApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

  apps-ios:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Anything changed in the last day?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = schedule ] && [ -z "$(git log --since=25.hours --format=%h -- native core drivers)" ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"; else echo "run=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        if: steps.changed.outputs.run == 'yes'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.changed.outputs.run == 'yes'
      - uses: actions/cache@v4 # the Kotlin/Native compiler and its iOS libraries (~1 GB)
        if: steps.changed.outputs.run == 'yes'
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('native/build.gradle.kts') }}
      - name: iOS app (SwiftUI + Shared framework) and its scenario tests (XCUITest, demo robot)
        if: steps.changed.outputs.run == 'yes'
        working-directory: native/iosApp
        run: |
          brew install xcodegen
          export IOS_DEVICE="$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+( Pro)?' )"
          echo "simulator: $IOS_DEVICE"
          SHOTS="$RUNNER_TEMP/ios-shots" WORK="$RUNNER_TEMP/ios" ./run-ui-tests.sh
      - uses: actions/upload-artifact@v4
        if: always() && steps.changed.outputs.run == 'yes'
        with:
          name: ios-screenshots-and-log
          path: |
            ${{ runner.temp }}/ios-shots/
            ${{ runner.temp }}/ios/test.log
