name: build
# Tests the buttons' firmware and every robot driver, then builds the firmware (the apps: workflow
# native). Download the build under Actions -> this run -> Artifacts.
on: [push, pull_request, workflow_dispatch]

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio cryptography
      - name: Firmware on a computer (editors, update manifest, syntax check)
        run: python tests/test_firmware.py
      - name: Every robot driver's own tests (against its simulated robot)
        run: for t in drivers/*/tests/test_*.py; do echo "== $t"; python "$t" || exit 1; done
      - name: Build the M5Stack firmware
        working-directory: firmware
        run: pio run
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/.pio/build/m5stack-core/firmware.bin
            firmware/.pio/build/m5stack-core/bootloader.bin
            firmware/.pio/build/m5stack-core/partitions.bin
